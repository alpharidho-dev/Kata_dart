<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- ================= SEO dasar ================= -->
  <title>KATA — Aplikasi Blog</title>
  <meta name="description" content="KATA adalah aplikasi blog mobile untuk menulis, membaca, dan mengelola artikel lengkap dengan hashtag, komentar, dan profil penulis.">
  <meta name="keywords" content="aplikasi blog, KATA, blog mobile, flutter, artikel, hashtag, REST API">
  <meta name="author" content="SMK Taruna Bhakti — Rekayasa Perangkat Lunak">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="canonical" href="./">

  <!-- ================= Open Graph / sosial ================= -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KATA">
  <meta property="og:title" content="KATA — Aplikasi Blog">
  <meta property="og:description" content="Tulis dan baca artikel blog dari smartphone: hashtag, komentar, dan profil penulis.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="id_ID">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KATA — Aplikasi Blog">
  <meta name="twitter:description" content="Tulis dan baca artikel blog dari smartphone: hashtag, komentar, dan profil penulis.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- ================= Performa: preconnect =================
       Koneksi awal ke domain font & gambar supaya render pertama tidak menunggu. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="dns-prefetch" href="https://res.cloudinary.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KATA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <noscript>
    Aplikasi KATA memerlukan JavaScript untuk berjalan. Aktifkan JavaScript pada browser
    kamu, atau gunakan aplikasi mobile Android/iOS.
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
